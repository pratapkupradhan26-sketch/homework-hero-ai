<!DOCTYPE html>
<html>
<head>
  <title>Homework Hero AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    * {margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

    body {
      background: linear-gradient(135deg,#667eea,#764ba2);
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      color:white;
    }

    .card {
      backdrop-filter:blur(15px);
      background:rgba(255,255,255,0.15);
      padding:35px;
      border-radius:20px;
      width:95%;
      max-width:700px;
      text-align:center;
      box-shadow:0 8px 32px rgba(0,0,0,0.3);
    }

    input, textarea {
      width:100%;
      padding:12px;
      border-radius:12px;
      border:none;
      margin-top:10px;
      outline:none;
    }

    textarea {resize:none;}

    .btn {
      margin-top:15px;
      padding:10px 25px;
      border-radius:25px;
      border:none;
      cursor:pointer;
      background:linear-gradient(90deg,#ff9966,#ff5e62);
      color:white;
      font-size:15px;
      transition:0.3s;
    }

    .btn:hover {
      transform:scale(1.05);
      box-shadow:0 0 15px rgba(255,94,98,0.8);
    }

    .answer {
      margin-top:20px;
      background:white;
      color:black;
      padding:15px;
      border-radius:12px;
      min-height:60px;
      text-align:left;
    }

    .hidden {display:none;}

    .premium {
      margin-top:20px;
      padding:15px;
      background:rgba(0,0,0,0.3);
      border-radius:12px;
    }

    img {width:140px;margin-top:10px;}
  </style>
</head>

<body>

<div class="card">

  <h2>📚 Homework Hero AI</h2>

  <!-- LOGIN SECTION -->
  <div id="loginSection">
    <input type="text" id="username" placeholder="Enter your name">
    <button class="btn" onclick="login()">Login</button>
  </div>

  <!-- MAIN APP -->
  <div id="appSection" class="hidden">

    <p id="welcome"></p>
    <p id="limitInfo"></p>

    <textarea id="question" rows="3" placeholder="Type your homework question here..."></textarea>
    <button class="btn" onclick="generateAnswer()">Solve My Homework 🚀</button>

    <div class="answer" id="answer">
      Your smart solution will appear here...
    </div>

    <div class="premium">
      <h3>Premium Access – ₹49</h3>
      <p>Unlimited questions. No daily limit.</p>
      <img src="upi-qr.png" alt="UPI QR Code">
    </div>

  </div>

</div>

<script>

let dailyLimit = 3;

function login() {
  let username = document.getElementById("username").value;
  if(!username){
    alert("Enter your name first!");
    return;
  }

  localStorage.setItem("user", username);

  if(!localStorage.getItem("questionsUsed")){
    localStorage.setItem("questionsUsed", 0);
  }

  showApp();
}

function showApp(){
  document.getElementById("loginSection").classList.add("hidden");
  document.getElementById("appSection").classList.remove("hidden");

  let username = localStorage.getItem("user");
  document.getElementById("welcome").innerHTML = "Welcome, " + username + " 👋";

  updateLimitInfo();
}

function updateLimitInfo(){
  let used = parseInt(localStorage.getItem("questionsUsed")) || 0;
  document.getElementById("limitInfo").innerHTML = 
    "Free Questions Left: " + (dailyLimit - used);
}

function generateAnswer(){
  let question = document.getElementById("question").value;
  let answerBox = document.getElementById("answer");
  let used = parseInt(localStorage.getItem("questionsUsed")) || 0;

  if(!question){
    alert("Type your question first!");
    return;
  }

  if(used >= dailyLimit){
    alert("Free limit reached! Upgrade to Premium.");
    return;
  }

  answerBox.innerHTML = "Generating answer... ⏳";

  setTimeout(()=>{
    answerBox.innerHTML = 
      "Demo Answer:\n\nStep 1: Understand the question.\nStep 2: Apply the concept.\nStep 3: Write final answer clearly.";
  },1000);

  localStorage.setItem("questionsUsed", used + 1);
  updateLimitInfo();
}

// Auto login if already logged
if(localStorage.getItem("user")){
  showApp();
}

</script>

</body>
</html>
